<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>マラソン練習ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 12px 40px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  header {
    padding: 20px 4px 12px; border-bottom: 1px solid var(--border); margin-bottom: 16px;
  }
  h1 { font-size: 1.15rem; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 0.85rem; }
  .headline { font-size: 1rem; margin-top: 10px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 16px;
  }
  .card h2 { font-size: 0.95rem; margin: 0 0 10px; color: var(--accent); }
  .chart-wrap { position: relative; width: 100%; height: 260px; }
  select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 0.85rem; margin-bottom: 8px;
  }
  .run-item { border-bottom: 1px solid var(--border); }
  .run-item:last-child { border-bottom: none; }
  .run-summary {
    padding: 10px 4px; cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; gap: 8px; font-size: 0.9rem;
  }
  .run-summary .meta { color: var(--muted); font-size: 0.8rem; }
  .run-detail { display: none; padding: 4px 4px 14px; font-size: 0.85rem; }
  .run-detail.open { display: block; }
  .stat-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; margin-bottom: 10px;
  }
  @media (min-width: 480px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
  .stat-grid div span { color: var(--muted); }
  .analysis-text {
    background: var(--bg); border-radius: 6px; padding: 10px; white-space: normal;
    font-size: 0.85rem;
  }
  .next-training {
    margin-top: 8px; padding: 8px 10px; background: rgba(56,189,248,0.12);
    border-left: 3px solid var(--accent); border-radius: 4px; font-size: 0.85rem;
  }
  footer { margin-top: 24px; color: var(--muted); font-size: 0.75rem; text-align: center; }
  .empty { color: var(--muted); padding: 20px 4px; }
</style>
</head>
<body>
<header>
  <h1>🏃 マラソン練習ダッシュボード</h1>
  <div class="sub" id="updated-at"></div>
  <div class="headline" id="headline"></div>
</header>

<div class="card">
  <h2>週間走行距離（直近12週）</h2>
  <div class="chart-wrap"><canvas id="chart-weekly"></canvas></div>
</div>

<div class="card">
  <h2>距離 × 平均ペース</h2>
  <div class="chart-wrap"><canvas id="chart-pace-scatter"></canvas></div>
</div>

<div class="card">
  <h2>気温別デカップリング率の推移</h2>
  <div class="chart-wrap"><canvas id="chart-decoupling"></canvas></div>
</div>

<div class="card">
  <h2>心拍推移（気温帯フィルタ）</h2>
  <select id="hr-temp-filter"></select>
  <div class="chart-wrap"><canvas id="chart-hr"></canvas></div>
</div>

<div class="card">
  <h2>RPE（体感）推移</h2>
  <div class="chart-wrap"><canvas id="chart-rpe"></canvas></div>
</div>

<div class="card">
  <h2>直近ラン一覧</h2>
  <div id="run-list"></div>
</div>

<footer>
  <div>バックアップはNAHAマラソンスプレッドシートの各 <code>_backup_auto_*</code> タブを参照。</div>
  <div id="generated-stamp"></div>
</footer>

 "", "rpe": null, "next_training_summary": "", "analysis_full_text": "# ランニングフィードバック（2026-09-21）\n\n## ①今日の評価\n8.02km／1:17:37／平均ペース9:40/km／平均心拍137（最大148）、気温30.4℃・体感30.0℃。この気温帯での心拍137は妥当な範囲で、まず「心拍が高い＝頑張りすぎ」という評価にはなりません。\n\nデカップリングは10.3%で判定は「超過」ですが、中身を見ると前半9:59/km・HR135.5 → 後半9:21/km・HR140.0と、ペースを上げながら心拍も上がるネガティブスプリット型。失速による乖離ではなく、入りを抑えすぎて後半に追い上げた結果、比率の差が開いた形です。\n\n## ②成長度合い\n同気温帯（29〜32℃）の過去走と比較すると、\n- 10/4：31.8℃・9:56/km・HR148・優良1.3%\n- 10/1：30.9℃・10:22/km・HR136・優良3.9%\n\n今日はこれらより速いペース（9:40/km）でありながら心拍は同等以下に収まっており、暑熱下での有酸素ベース自体は着実に積み上がっています。一方でペース配分の精度（前半/後半の差）はまだ粗く、そこが数値悪化の主因。強化期序盤としての走り込みは週4ペースで安定して継続できています。\n\n## ③次回のポイント\n今回のように入りを慎重にしすぎて後半に上げるパターンは、デカップリング数値を悪化させやすいので、次回は前半から淡々と同じペース感を意識（前半後半の差を縮める）。気温30℃前後が続く間は、心拍140台前半を一つの目安にしつつ、体感優先でペースを微調整してください。強化期序盤につき、距離は現状維持〜微増で、まずはペースの均一性を試すのがおすすめです。\n\n**次回：9月22日（火）に9km・気温想定30℃前後・目安ペース9:40〜9:50/km、前半から終盤まで一定ペースを意識して走る。**"}, {"activity_id": "24454185227", "date": "2026-09-22", "distance_km": 10.03, "duration": "1:33:14", "avg_pace": "9:18/km", "avg_pace_sec": 558, "avg_hr": 133.0, "max_hr": 144.0, "avg_temperature": 29.0, "temp_class": "28~31℃", "humidity_pct": 66.0, "heat_index_c": 30.0, "decoupling_pct": 4.4, "avg_cadence": 170.0, "avg_gct": 279.0, "note": "", "rpe": null, "next_training_summary": "次回：9月24日（木）に8km・気温想定29℃前後・入りペース9:30/km目安、平均心拍130台を目標に前半抑え気味で走る", "analysis_full_text": "# ①今日の評価\n距離10.03km・タイム1:33:14・平均ペース9:18/km・平均心拍133・気温29.0℃（体感30.0℃）というコンディションでした。この気温帯では心拍130台は自然な範囲で、問題視する数値ではありません。デカップリング率は4.4%で「優良」判定、前半9:36/km・心拍134.4→後半8:59/km・心拍131.3と、ペースを上げながら心拍はむしろ落ち着いており、有酸素基盤がしっかり機能した走りです。ピッチ170spm・GCT279msも安定しており、登り5km(9:38/km)→下り(8:45/km)→平坦(9:05/km)の推移も違和感なく、起伏への適応も良好です。\n\n# ②成長度合い\n同気温帯（27〜32℃）の直近記録と比べると明確な改善が見えます。29.2〜29.7℃帯の10/13・10/10は心拍140台でデカップリングが12%超（超過）でしたが、今日は同程度の気温で心拍133・4.4%（優良）と大きく改善。さらに27.1℃・心拍133・9:27/kmだった10/6（6.9%許容）と比べても、今日は気温が2℃高いのにペースが速く(9:18<9:27)、デカップリングも優良に向上しています。暑さへの耐性と後半の粘りが着実に積み上がっている証拠です。\n\n# ③次回のポイント\n強化期序盤（8日目/41日、残り33日）はまだ有酸素基盤づくりが主目的の時期です。今日のような「入りを抑えて後半粘る」ペース配分が好結果に直結している ": "9:27/km", "avg_pace_sec": 567, "avg_hr": 133.0, "max_hr": 145.0, "avg_temperature": 27.1, "temp_class": "25~28℃", "humidity_pct": 57.0, "heat_index_c": 25.0, "decoupling_pct": 6.9, "avg_cadence": 167.0, "avg_gct": 284.0, "note": "RPE 2.0/10 ・ 体感:普通", "rpe": 2.0, "next_training_summary": "次回：10月8日（木）に8km・気温想定28℃・前半9:30/km→後半8:30〜8:50/kmのビルドアップ走", "analysis_full_text": "**①今日の評価**\n10.26km・1:36:54・平均ペース9:27/km・平均心拍133、気温27.1℃でした。デカップリング率は6.9%で「許容」判定、RPEは2.0/10と非常に低く「普通」の体感です。ラップを見ると前半9:45/km→後半9:10/kmとペースが上がっているにもかかわらず心拍はほぼ横ばい（133.0→133.7）で、心拍と体感の両面から見て余裕を持って走れた1本と言えます。登り区間9:54/km・平坦9:20/km・下り8:50/kmと起伏にも素直に反応しており、無理のあるペース配分ではありません。\n\n**②成長度合い**\n同気温帯（27〜30℃）の直近記録と比べると、10/15(心拍140・超過30.7%)、10/13(140・超過12%)、10/10(144・超過12.9%)、10/08(142・超過23.2%)と軒並みデカップリングが超過していたのに対し、今日は心拍133と最も低く、デカップリングも6.9%許容まで改善しています。同じような気温帯でここまで安定した乖離に収まったのは今回が一番良く、有酸素基盤がしっかり積み上がってきているサインです。強化期中盤に入り、負荷をかけても崩れにくい土台ができつつあります。\n\n**③次回のポイント**\nRPEに余裕があり、デカップリングも安定しているため、次回は強化期中盤の目的に沿って軽めの閾値走（ビルドアップ）を試すタイミングです。入りは抑えめ（9:30/km程度）からスタートし、後半だけ8:30〜8:50/kmまで上げる形にしましょう。気温28℃前後を想定するなら、平均心拍135〜145台で収まっていれば順調です。無理に数字を追わず、体感がきつくなったらペースを戻してください。\n\n次回：10月8日（木）に8km・気温想定28℃・前半9:30/km→後半8:30〜8:50/kmのビルドアップ走"}, {"activity_id": "24652210606", "date": "2026-10-08", "distance_km": 7.52, "duration": "1:07:28", "avg_pace": "8:58/km", "avg_pace_sec": 538, "avg_hr": 142.0, "max_hr": 168.0, "avg_temperature": 27.8, "temp_class": "25~28℃", "humidity_pct": 89.0, "heat_index_c": 23.9, "decoupling_pct": 23.2, "avg_cadence": 166.0, "avg_gct": 285.0, "note": "RPE 2.0/10 ・ 体感:普通", "rpe": 2.0, "next_training_summary": "次回：10月9日（金）に7〜8km・気温想定28℃前後・入り9:00/km目安、後半上げても8:40/km程度までに抑える走りを提案します。", "analysis_full_text": "**①今日の評価**\n7.52km・1:07:28・平均ペース8:58/km・平均心拍142・気温27.8℃（湿度89%）というコンディションでした。デカップリング率は23.2%で「超過」判定ですが、ラップを見ると前半(1〜5km)は9:27/km・心拍136台、後半(6〜8km)は8:25/km・心拍149台と、自らペースを上げていくネガティブスプリット型の走りになっており、数値が大きく出たのは暑熱ドリフトというより「後半に意図的にペースアップした」ことが主因と考えられます。RPEは2.0/10・体感「普通」と非常に余裕があり、Z4は19.2分ありますが本人の感覚とのズレはなく、オーバーペースでの無理な走りではなさそうです。\n\n**②成長度合い**\n同気温帯（27〜29℃台）の過去記録と比較すると、10/6(27.1℃・6.9%許容)のように抑えたペースでは良好な数値が出る一方、10/15(27.1℃・30.7%超過)や10/13(29.2℃・12%超過)のようにペースを上げる日はデカップリングが大きく出る傾向が一貫しています。つまり「暑さへの耐性」自体は安定しており、ペース配分（特に後半の上げ幅）が数値を左右している段階です。ピッチ166spm・GCT285msは大きな崩れなく、登り2.0km(10:09/km)→下り(8:21/km)→平坦(8:42/km)という起伏への対応も自然な範囲でした。\n\n**③次回のポイント**\n強化期中盤（24日目／残り17日）のタイミングなので、今は無理に追い込むより「ペース感覚を揃える」ことを優先しましょう。次回は入りを9:00/km前後に抑え、後半も上げるとしても8:40/km程度までに留めると、デカップリングが許容〜優良域に収まりやすいはずです。気温28℃前後なら平均心拍140台前半を目安に、RPE3〜4程度の「会話がギリギリできる」感覚で管理してください。\n\n次回：10月9日（金）に7〜8km・気温想定28℃前後・入り9:00/km目安、後半上げても8:40/km程度までに抑える走りを提案します。"}, {"activity_id": "24672597085", "date": "2026-10-10", "distance_km": 14.02, "duration": "2:10:11", "avg_pace": "9:17/km", "avg_pace_sec": 557, "avg_hr": 144.0, "max_hr": 166.0, "avg_temperature": 29.7, "temp_class": "28~31℃", "humidity_pct": 70.0, "heat_index_c": 30.6, "decoupling_pct": 12.9, "avg_cadence": 168.0, "avg_gct": 282.0, "note": "RPE 3.0/10 ・ 体感:良い", "rpe": 3.0, "next_training_summary": "次回：10月12日（月）に8km・気温想定29℃・目安ペース9:30〜10:00/km（平均心拍140台前半目安）でリカバリージョグ。", "analysis_full_text": "# ランニングフィードバック（2026-10-10）\n\n## ①今日の評価\n距離14.02km・タイム2:10:11・平均ペース9:17/km・平均心拍144（最大166）。気温29.7℃／体感温度30.6℃・湿度70%という高温下でのランです。デカップリング率は12.9%で「超過」判定ですが、本人RPEは3.0/10・体感「良い」と非常に余裕のある内容でした。ラップを見ると前半心拍125→143、後半139→161と気温による心拍ドリフトが進む一方、ペースはむしろ後半やや速い(9:14 vs 9:21)。心拍上昇はペース過多というより暑熱要因が主体と判断でき、RPEの低さがそれを裏付けています。\n\n## ②成長度合い\n同気温帯(27〜32℃)の過去記録と比較すると、10/13（29.2℃・8:58/km・心拍140・デカ12%超過）が最も近い条件です。今日はそれより約2km長い距離（14.02km）を走りながらほぼ同水準のデカップリングに収まっており、長距離での耐性は維持できています。一方、10/4（31.8℃・13.02km・デカ1.3%優良）と比べるとペースが9:56/kmとより抑えめだったことが低デカップリングにつながっており、「気温が高い日ほど入りのペースを落とす」ことの効果が数値で確認できます。週4回前後のペースで14km走まで距離を伸ばせている点は行動面でも着実な成長です。\n\n## ③次回のポイント\n暑熱下では心拍よりも体感（RPE）を優先して調整してください。強化期中盤（残り15日）であり、今日は距離を踏めたぶん、次回はリカバリー寄りのjogで疲労を抜くのが適切です。気温29℃前後を想定するなら、入りは9:30〜10:00/km程度に抑え、平均心拍140台前半に収まる体感（「楽〜ややきつい」程度）を目安にしてください。\n\n次回：10月12日（月）に8km・気温想定29℃・目安ペース9:30〜10:00/km（平均心拍140台前半目安）でリカバリージョグ。"}, {"activity_id": "24708592881", "date": "2026-10-13", "distance_km": 10.23, "duration": "1:31:43", "avg_pace": "8:58/km", "avg_pace_sec": 538, "avg_hr": 140.0, "max_hr": 150.0, "avg_temperature": 29.2, "temp_class": "28~31℃", "humidity_pct": 94.0, "heat_index_c": 26.1, "decoupling_pct": 12.0, "avg_cadence": 171.0, "avg_gct": 277.0, "note": "RPE 2.0/10 ・ 体感:普通", "rpe": 2.0, "next_training_summary": "次回：10月17日（土）に10km前後のLSD、気温想定29〜30℃、入りのペース目安9:30/km・体感で調整しながら後半少しだけ上げる構成。", "analysis_full_text": "①今日の評価\n10.23kmを1:31:43、平均ペース8:58/km、平均心拍140で走破。気温29.2℃・湿度94%と蒸し暑い条件で、この心拍は自然な範囲です。デカップリングは12.0%で「超過」ラベルですが、内訳を見ると前半9:27/km→後半8:30/kmとペースを上げたのに心拍は140→141とほぼ横ばい。これは心肺が余裕を持って追従できている証拠で、ペース超過型の自然な数値上昇と解釈できます。RPE2.0/10・体感「普通」という低い主観評価とも整合しており、暑熱下でもしっかり余裕を残して走れた1本です。\n\n②成長度合い\n同気温帯(27〜32℃)で比較すると、10/8(27.8℃・8:58/km・HR142・デカップリング23.2%超過)とほぼ同じペース帯ですが、今日は気温がやや高いにも関わらずHRが低く(140)、デカップリング率も12.0%まで改善しています。10/10(29.7℃・9:17/km・HR144・12.9%超過)と比べても、より速いペースで心拍・デカップリング共に同等以下に収まっており、暑熱環境への適応と有酸素基盤の底上げが着実に進んでいる様子がうかがえます。継続的に走り込めている点も good です。\n\n③次回のポイント\n強化期終盤(残り12日)に入っているため、閾値刺激もそろそろ取り入れたい時期ですが、直近は後半ペースアップ型のデカップリング超過が続いているため、まずは入りのペースを少し落として体感(RPE)で前半をコントロールする意識を継続してください。心拍はあくまで気温とセットで見る指標とし、気温29℃前後なら平均心拍140台前半を目安に、無理に追い込まず終盤までイーブン〜ネガティブスプリットを目指しましょう。\n\n次回：10月17日（土）に10km前後のLSD、気温想定29〜30℃、入りのペース目安9:30/km・体感で調整しながら後半少しだけ上げる構成。"}, {"activity_id": "24734655937", "date": "2026-10-15", "distance_km": 7.01, "duration": "1:00:27", "avg_pace": "8:37/km", "avg_pace_sec": 517, "avg_hr": 140.0, "max_hr": 154.0, "avg_temperature": 27.1, "temp_class": "25~28℃", "humidity_pct": 88.0, "heat_index_c": 20.0, "decoupling_pct": 30.7, "avg_cadence": 169.0, "avg_gct": 279.0, "note": "RPE 3.0/10 ・ 体感:良い", "rpe": 3.0, "next_training_summary": "次回：10月17日（土）に14〜15km・気温想定29℃・入りペース9:30/km目安でLSD実施。", "analysis_full_text": "**①今日の評価**\n距離7.01km・タイム1:00:27・平均ペース8:37/km・平均心拍140・気温27.1℃でした。デカップリング率は30.7%で数値上は「超過」ラベルですが、内訳を見ると前半は登り区間を含み9:26/km・HR138、後半は下りを含み7:33/km・HR144と、心拍はほぼ横ばいなのにペースだけ大きく上がっています。つまり地形（登り→下り）によるペース変化がデカップリング値を押し上げた形で、暑熱ストレスや心拍の頑張りすぎではなさそうです。RPE3.0/10・体感「良い」という本人評価とも整合しており、余裕を持って走れた1本と判断します。\n\n**②成長度合い**\n同じ27℃前後の練習と比べると、10/6(9:27/km・HR133・許容6.9%)より今日は8:37/kmとペースが上がっているのに心拍は140と小幅な上昇にとどまっています。ペースアップ分を考えると心拍の伸びは穏やかで、暑熱順応・有酸素基盤の底上げが進んでいる兆候です。ピッチ169spm・GCT279msも安定しており、フォーム面でも崩れは見られません。\n\n**③次回のポイント**\n強化期終盤（残り10日）に入っているので、無理に強度を上げず、週末LSDで距離の土台固めを継続しましょう。次回は土曜に直近LSD(10/10・14.02km)からやや伸ばして14〜15km程度を目安に、入りは9:30/km程度に抑えてスタートし、気温29℃前後なら平均心拍140台前半を目安に、心拍よりも体感（RPE4以下目安）で調整してください。\n\n次回：10月17日（土）に14〜15km・気温想定29℃・入りペース9:30/km目安でLSD実施。"}]}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('dashboard-data').textContent);

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function nl2br(s) { return escapeHtml(s).replace(/\n/g, '<br>'); }
  function fmtNum(v, digits) {
    if (v === null || v === undefined) return '-';
    return Number(v).toFixed(digits === undefined ? 1 : digits);
  }

  // --- ヘッダー ---
  document.getElementById('updated-at').textContent =
    '最終更新: ' + DATA.generated_at +
    (DATA.goal.days_until_race !== null
      ? ' ／ ' + DATA.goal.race_name + 'まで残り ' + DATA.goal.days_until_race + '日'
      : '');
  var cw = DATA.current_week;
  document.getElementById('headline').textContent =
    '今週の練習：' + cw.count + '/' + cw.target_weekly_runs + '回・週間距離: ' +
    fmtNum(cw.distance_km, 1) + 'km';
  document.getElementById('generated-stamp').textContent = 'Generated at ' + DATA.generated_at;

  var COLORS = ['#38bdf8', '#4ade80', '#fbbf24', '#f87171', '#a78bfa'];

  if (!DATA.runs.length) {
    ['chart-weekly', 'chart-pace-scatter', 'chart-decoupling', 'chart-hr', 'chart-rpe'].forEach(function (id) {
      document.getElementById(id).parentNode.innerHTML = '<div class="empty">まだデータがありません</div>';
    });
    document.getElementById('run-list').innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }

  // --- 週間走行距離（バー） ---
  new Chart(document.getElementById('chart-weekly'), {
    type: 'bar',
    data: {
      labels: DATA.weekly_series.map(function (w) { return w.week_start; }),
      datasets: [{ label: '週間距離(km)', data: DATA.weekly_series.map(function (w) { return w.distance_km; }), backgroundColor: COLORS[0] }]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
  });

  // --- 距離×平均ペース散布図 ---
  var scatterPoints = DATA.runs.filter(function (r) { return r.distance_km !== null && r.avg_pace_sec !== null; })
    .map(function (r) { return { x: r.distance_km, y: r.avg_pace_sec, date: r.date }; });
  new Chart(document.getElementById('chart-pace-scatter'), {
    type: 'scatter',
    data: { datasets: [{ label: '距離(km) × ペース(秒/km)', data: scatterPoints, backgroundColor: COLORS[1] }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { title: { display: true, text: '距離(km)' } }, y: { title: { display: true, text: 'ペース(秒/km、速いほど下)' }, reverse: true } },
      plugins: { tooltip: { callbacks: { label: function (ctx) { return ctx.raw.date + ': ' + ctx.raw.x + 'km'; } } } }
    }
  });

  // --- 気温別デカップリング率 ---
  var decouplingDatasets = DATA.temp_class_labels.map(function (label, i) {
    var points = DATA.runs.filter(function (r) { return r.temp_class === label && r.decoupling_pct !== null; })
      .map(function (r) { return { x: r.date, y: r.decoupling_pct }; });
    return { label: label, data: points, borderColor: COLORS[i % COLORS.length], backgroundColor: COLORS[i % COLORS.length], showLine: true, tension: 0.2 };
  });
  new Chart(document.getElementById('chart-decoupling'), {
    type: 'line',
    data: { datasets: decouplingDatasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { type: 'category' }, y: { title: { display: true, text: 'デカップリング率(%)' } } }
    }
  });

  // --- 心拍推移（気温帯フィルタ） ---
  var hrSelect = document.getElementById('hr-temp-filter');
  var allOption = document.createElement('option');
  allOption.value = ''; allOption.textContent = 'すべて';
  hrSelect.appendChild(allOption);
  DATA.temp_class_labels.forEach(function (label) {
    var opt = document.createElement('option');
    opt.value = label; opt.textContent = label;
    hrSelect.appendChild(opt);
  });
  var hrChart = new Chart(document.getElementById('chart-hr'), {
    type: 'line',
    data: { labels: [], datasets: [{ label: '平均心拍', data: [], borderColor: COLORS[3], tension: 0.2 }] },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { title: { display: true, text: 'bpm' } } } }
  });
  function renderHrChart(filterClass) {
    var rows = DATA.runs.filter(function (r) { return r.avg_hr !== null && (!filterClass || r.temp_class === filterClass); });
    hrChart.data.labels = rows.map(function (r) { return r.date; });
    hrChart.data.datasets[0].data = rows.map(function (r) { return r.avg_hr; });
    hrChart.update();
  }
  hrSelect.addEventListener('change', function () { renderHrChart(hrSelect.value); });
  renderHrChart('');

  // --- RPE推移 ---
  var rpeRows = DATA.runs.filter(function (r) { return r.rpe !== null; });
  new Chart(document.getElementById('chart-rpe'), {
    type: 'line',
    data: {
      labels: rpeRows.map(function (r) { return r.date; }),
      datasets: [{ label: 'RPE (0-10)', data: rpeRows.map(function (r) { return r.rpe; }), borderColor: COLORS[2], tension: 0.2 }]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 10 } } }
  });

  // --- 直近ラン一覧（新しい順・アコーディオン） ---
  var listEl = document.getElementById('run-list');
  var runsDesc = DATA.runs.slice().reverse();
  runsDesc.forEach(function (r, idx) {
    var item = document.createElement('div');
    item.className = 'run-item';

    var summary = document.createElement('div');
    summary.className = 'run-summary';
    summary.innerHTML =
      '<span>' + escapeHtml(r.date) + '　' + fmtNum(r.distance_km, 2) + 'km　' + escapeHtml(r.avg_pace || '-') + '</span>' +
      '<span class="meta">' + (r.avg_temperature !== null ? fmtNum(r.avg_temperature, 1) + '℃　' : '') +
      (r.decoupling_pct !== null ? 'デカップリング' + fmtNum(r.decoupling_pct, 1) + '%' : '') + ' ▾</span>';

    var detail = document.createElement('div');
    detail.className = 'run-detail';
    detail.innerHTML =
      '<div class="stat-grid">' +
      '<div><span>タイム: </span>' + escapeHtml(r.duration || '-') + '</div>' +
      '<div><span>平均心拍: </span>' + (r.avg_hr !== null ? fmtNum(r.avg_hr, 0) + 'bpm' : '-') + '</div>' +
      '<div><span>湿度: </span>' + (r.humidity_pct !== null ? fmtNum(r.humidity_pct, 0) + '%' : '-') + '</div>' +
      '<div><span>体感温度: </span>' + (r.heat_index_c !== null ? fmtNum(r.heat_index_c, 1) + '℃' : '-') + '</div>' +
      '<div><span>ピッチ: </span>' + (r.avg_cadence !== null ? fmtNum(r.avg_cadence, 0) + 'spm' : '-') + '</div>' +
      '<div><span>GCT: </span>' + (r.avg_gct !== null ? fmtNum(r.avg_gct, 0) + 'ms' : '-') + '</div>' +
      '</div>' +
      (r.note ? '<div>体感メモ: ' + escapeHtml(r.note) + '</div>' : '') +
      (r.analysis_full_text ? '<div class="analysis-text">' + nl2br(r.analysis_full_text) + '</div>' : '') +
      (r.next_training_summary ? '<div class="next-training">' + escapeHtml(r.next_training_summary) + '</div>' : '');

    summary.addEventListener('click', function () { detail.classList.toggle('open'); });
    item.appendChild(summary);
    item.appendChild(detail);
    listEl.appendChild(item);
  });
})();
</script>
