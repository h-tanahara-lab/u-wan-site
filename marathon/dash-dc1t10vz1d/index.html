<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>マラソン練習ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 12px 40px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  header {
    padding: 20px 4px 12px; border-bottom: 1px solid var(--border); margin-bottom: 16px;
  }
  h1 { font-size: 1.15rem; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 0.85rem; }
  .headline { font-size: 1rem; margin-top: 10px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 16px;
  }
  .card h2 { font-size: 0.95rem; margin: 0 0 10px; color: var(--accent); }
  .chart-wrap { position: relative; width: 100%; height: 260px; }
  select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 0.85rem; margin-bottom: 8px;
  }
  .run-item { border-bottom: 1px solid var(--border); }
  .run-item:last-child { border-bottom: none; }
  .run-summary {
    padding: 10px 4px; cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; gap: 8px; font-size: 0.9rem;
  }
  .run-summary .meta { color: var(--muted); font-size: 0.8rem; }
  .run-detail { display: none; padding: 4px 4px 14px; font-size: 0.85rem; }
  .run-detail.open { display: block; }
  .stat-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; margin-bottom: 10px;
  }
  @media (min-width: 480px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }
  .stat-grid div span { color: var(--muted); }
  .analysis-text {
    background: var(--bg); border-radius: 6px; padding: 10px; white-space: normal;
    font-size: 0.85rem;
  }
  .next-training {
    margin-top: 8px; padding: 8px 10px; background: rgba(56,189,248,0.12);
    border-left: 3px solid var(--accent); border-radius: 4px; font-size: 0.85rem;
  }
  .goal-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 560px) { .goal-grid { grid-template-columns: 1fr 1fr; } }
  table.targets { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.targets td, table.targets th { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  .big { font-size: 1.25rem; font-weight: 700; }
  .gap-pos { color: var(--warn); } .gap-neg { color: var(--good); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 0.75rem; margin: 2px 4px 2px 0; background: rgba(251,191,36,0.15); color: var(--warn); }
  .tag.ng { background: rgba(248,113,113,0.15); color: var(--bad); }
  .tag.ok { background: rgba(74,222,128,0.15); color: var(--good); }
  .pre { white-space: pre-wrap; font-size: 0.82rem; }
  .small-chart { position: relative; width: 100%; height: 220px; margin-top: 8px; }
  footer { margin-top: 24px; color: var(--muted); font-size: 0.75rem; text-align: center; }
  .empty { color: var(--muted); padding: 20px 4px; }
</style>
</head>
<body>
<header>
  <h1>🏃 マラソン練習ダッシュボード</h1>
  <div class="sub" id="updated-at"></div>
  <div class="headline" id="headline"></div>
</header>

<div class="card" id="goal-card">
  <h2>目標ギャップ</h2>
  <div class="goal-grid">
    <div>
      <table class="targets" id="targets-table"></table>
      <div class="sub" id="goal-conditions" style="margin-top:8px"></div>
    </div>
    <div>
      <div class="sub">現在の予想タイム（フルマラソン）</div>
      <div class="big" id="forecast-time">-</div>
      <div id="forecast-gap"></div>
      <div class="sub pre" id="forecast-method" style="margin-top:6px"></div>
    </div>
  </div>
  <div class="sub" id="goal-theme" style="margin-top:10px"></div>
</div>

<div class="card">
  <h2>週ごとの計画距離と実績距離</h2>
  <div class="chart-wrap"><canvas id="chart-plan"></canvas></div>
</div>

<div class="card" id="adjust-card">
  <h2>ペース調整の判定（コード判定・表示のみ）</h2>
  <div class="pre" id="adjust-lines"></div>
</div>

<div class="card">
  <h2>週間走行距離（直近12週）</h2>
  <div class="chart-wrap"><canvas id="chart-weekly"></canvas></div>
</div>

<div class="card">
  <h2>距離 × 平均ペース</h2>
  <div class="chart-wrap"><canvas id="chart-pace-scatter"></canvas></div>
</div>

<div class="card">
  <h2>気温別デカップリング率の推移</h2>
  <div class="chart-wrap"><canvas id="chart-decoupling"></canvas></div>
</div>

<div class="card">
  <h2>心拍推移（気温帯フィルタ）</h2>
  <select id="hr-temp-filter"></select>
  <div class="chart-wrap"><canvas id="chart-hr"></canvas></div>
</div>

<div class="card">
  <h2>W/bpm（パワー÷心拍）の推移</h2>
  <div class="chart-wrap"><canvas id="chart-wpb"></canvas></div>
</div>

<div class="card">
  <h2>RPE（体感）推移</h2>
  <div class="chart-wrap"><canvas id="chart-rpe"></canvas></div>
</div>

<div class="card">
  <h2>直近ラン一覧</h2>
  <div id="run-list"></div>
</div>

<footer>
  <div>バックアップはNAHAマラソンスプレッドシートの各 <code>_backup_auto_*</code> タブを参照。</div>
  <div id="generated-stamp"></div>
</footer>

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('dashboard-data').textContent);

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function nl2br(s) { return escapeHtml(s).replace(/\n/g, '<br>'); }
  function fmtNum(v, digits) {
    if (v === null || v === undefined) return '-';
    return Number(v).toFixed(digits === undefined ? 1 : digits);
  }

  function fmtMmss(sec) {
    var t = Math.round(sec), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') + m : m) + ':' + (s < 10 ? '0' : '') + s;
  }
  function tagsHtml(r) {
    var tags = [];
    if (r.decoupling_notes) { r.decoupling_notes.split(' / ').forEach(function (t) { tags.push('<span class="tag">' + escapeHtml(t) + '</span>'); }); }
    if (r.plan_status) { tags.push('<span class="tag ' + (r.plan_status === 'OK' ? 'ok' : 'ng') + '">計画照合：' + escapeHtml(r.plan_status) + '</span>'); }
    if (r.decoupling_basis) { tags.push('<span class="tag">判定指標：' + escapeHtml(r.decoupling_basis) + '</span>'); }
    return tags.length ? '<div style="margin:6px 0">' + tags.join('') + '</div>' : '';
  }
  var drawn = {};
  function drawKmChart(r) {
    if (!r.km || !r.km.labels || drawn[r.activity_id]) return;
    var el = document.getElementById('km-chart-' + r.activity_id);
    if (!el) return;
    drawn[r.activity_id] = true;
    new Chart(el, {
      data: {
        labels: r.km.labels,
        datasets: [
          { type: 'bar', label: '標高差(m)', data: r.km.elev, backgroundColor: 'rgba(148,163,184,0.45)', yAxisID: 'yElev', order: 3 },
          { type: 'line', label: 'ペース(秒/km)', data: r.km.pace, borderColor: '#38bdf8', yAxisID: 'yPace', tension: 0.2, order: 1 },
          { type: 'line', label: 'GAP(秒/km)', data: r.km.gap, borderColor: '#4ade80', borderDash: [4, 3], yAxisID: 'yPace', tension: 0.2, order: 1 },
          { type: 'line', label: '心拍', data: r.km.hr, borderColor: '#f87171', yAxisID: 'yHr', tension: 0.2, order: 2 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          yPace: { position: 'left', reverse: true, title: { display: true, text: 'ペース(秒/km)' } },
          yHr: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '心拍' } },
          yElev: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '標高差(m)' } }
        }
      }
    });
  }

  // --- ヘッダー ---
  document.getElementById('updated-at').textContent =
    '最終更新: ' + DATA.generated_at +
    (DATA.goal.days_until_race !== null
      ? ' ／ ' + DATA.goal.race_name + 'まで残り ' + DATA.goal.days_until_race + '日'
      : '');
  var cw = DATA.current_week;
  document.getElementById('headline').textContent =
    '今週の練習：' + cw.count + '/' + cw.target_weekly_runs + '回・週間距離: ' +
    fmtNum(cw.distance_km, 1) + 'km' + (cw.planned_km !== null && cw.planned_km !== undefined ? '（計画 ' + fmtNum(cw.planned_km, 1) + 'km）' : '');
  document.getElementById('generated-stamp').textContent = 'Generated at ' + DATA.generated_at;

  var COLORS = ['#38bdf8', '#4ade80', '#fbbf24', '#f87171', '#a78bfa'];

  // --- 目標ギャップパネル ---
  var GP = DATA.goal_panel;
  function fmtSec(sec) {
    var a = Math.abs(sec), m = Math.floor(a / 60), s = a % 60;
    return (sec < 0 ? '-' : '+') + m + '分' + (s < 10 ? '0' : '') + s + '秒';
  }
  var tt = document.getElementById('targets-table');
  tt.innerHTML = '<tr><th>目標</th><th>タイム</th><th>平均ペース</th></tr>' +
    GP.targets.map(function (t) { return '<tr><td>' + escapeHtml(t.label) + '</td><td>' + escapeHtml(t.time) + '</td><td>' + escapeHtml(t.pace) + '</td></tr>'; }).join('') +
    '<tr><td>制限時間</td><td>' + escapeHtml(GP.cutoff) + '</td><td>' + escapeHtml(GP.cutoff_pace) + '</td></tr>';
  document.getElementById('goal-conditions').textContent = '本番：' + GP.race_conditions;
  var fc = GP.forecast;
  document.getElementById('forecast-time').textContent = fc.time ? fc.time + '（平均 ' + fc.pace + '）' : '算出不可（条件を満たすランなし）';
  var gapEl = document.getElementById('forecast-gap');
  if (fc.gap_to_goal_sec !== null && fc.gap_to_goal_sec !== undefined) {
    gapEl.innerHTML = '<span class="' + (fc.gap_to_goal_sec > 0 ? 'gap-pos' : 'gap-neg') + '">6時間切り目標との差 ' + fmtSec(fc.gap_to_goal_sec) + '</span>';
  }
  document.getElementById('forecast-method').textContent = fc.method || '';
  document.getElementById('goal-theme').textContent =
    '週テーマ：' + GP.theme + (GP.days_until_race !== null ? '　／　本番まで残り ' + GP.days_until_race + '日' : '');
  if (DATA.adjust) {
    document.getElementById('adjust-lines').textContent = DATA.adjust.lines.join('\n');
  } else {
    document.getElementById('adjust-card').style.display = 'none';
  }
  if (GP.plan_vs_actual.length) {
    new Chart(document.getElementById('chart-plan'), {
      type: 'bar',
      data: {
        labels: GP.plan_vs_actual.map(function (w) { return w.week_start.slice(5) + ' ' + w.theme; }),
        datasets: [
          { label: '計画(km)', data: GP.plan_vs_actual.map(function (w) { return w.planned_km; }), backgroundColor: '#64748b' },
          { label: '実績(km)', data: GP.plan_vs_actual.map(function (w) { return w.actual_km; }), backgroundColor: '#38bdf8' }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });
  } else {
    document.getElementById('chart-plan').parentNode.innerHTML = '<div class="empty">練習計画タブを読み込めませんでした</div>';
  }

  if (!DATA.runs.length) {
    ['chart-weekly', 'chart-pace-scatter', 'chart-decoupling', 'chart-hr', 'chart-rpe', 'chart-wpb'].forEach(function (id) {
      document.getElementById(id).parentNode.innerHTML = '<div class="empty">まだデータがありません</div>';
    });
    document.getElementById('run-list').innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }

  // --- 週間走行距離（バー） ---
  new Chart(document.getElementById('chart-weekly'), {
    type: 'bar',
    data: {
      labels: DATA.weekly_series.map(function (w) { return w.week_start; }),
      datasets: [{ label: '週間距離(km)', data: DATA.weekly_series.map(function (w) { return w.distance_km; }), backgroundColor: COLORS[0] }]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
  });

  // --- 距離×平均ペース散布図 ---
  var scatterPoints = DATA.runs.filter(function (r) { return r.distance_km !== null && r.avg_pace_sec !== null; })
    .map(function (r) { return { x: r.distance_km, y: r.avg_pace_sec, date: r.date }; });
  new Chart(document.getElementById('chart-pace-scatter'), {
    type: 'scatter',
    data: { datasets: [{ label: '距離(km) × ペース(秒/km)', data: scatterPoints, backgroundColor: COLORS[1] }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { title: { display: true, text: '距離(km)' } }, y: { title: { display: true, text: 'ペース(秒/km、速いほど下)' }, reverse: true } },
      plugins: { tooltip: { callbacks: { label: function (ctx) { return ctx.raw.date + ': ' + ctx.raw.x + 'km'; } } } }
    }
  });

  // --- 気温別デカップリング率 ---
  // 旧計算式の行は新方式と比べられないので除外。参考値（移動45分未満／停止多め）は別系列（点線）で成長判定に使わない
  var decouplingDatasets = DATA.temp_class_labels.map(function (label, i) {
    var points = DATA.runs.filter(function (r) { return r.new_style && !r.reference_only && r.temp_class === label && r.decoupling_pct !== null; })
      .map(function (r) { return { x: r.date, y: r.decoupling_pct }; });
    return { label: label, data: points, borderColor: COLORS[i % COLORS.length], backgroundColor: COLORS[i % COLORS.length], showLine: true, tension: 0.2 };
  });
  decouplingDatasets.push({
    label: '参考値（成長判定に使わない）',
    data: DATA.runs.filter(function (r) { return r.new_style && r.reference_only && r.decoupling_pct !== null; })
      .map(function (r) { return { x: r.date, y: r.decoupling_pct }; }),
    borderColor: '#94a3b8', backgroundColor: '#94a3b8', borderDash: [5, 4], showLine: true, tension: 0.2
  });
  new Chart(document.getElementById('chart-decoupling'), {
    type: 'line',
    data: { datasets: decouplingDatasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { type: 'category' }, y: { title: { display: true, text: 'デカップリング率(%)' } } }
    }
  });

  // --- 心拍推移（気温帯フィルタ） ---
  var hrSelect = document.getElementById('hr-temp-filter');
  var allOption = document.createElement('option');
  allOption.value = ''; allOption.textContent = 'すべて';
  hrSelect.appendChild(allOption);
  DATA.temp_class_labels.forEach(function (label) {
    var opt = document.createElement('option');
    opt.value = label; opt.textContent = label;
    hrSelect.appendChild(opt);
  });
  var hrChart = new Chart(document.getElementById('chart-hr'), {
    type: 'line',
    data: { labels: [], datasets: [{ label: '平均心拍', data: [], borderColor: COLORS[3], tension: 0.2 }] },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { title: { display: true, text: 'bpm' } } } }
  });
  function renderHrChart(filterClass) {
    var rows = DATA.runs.filter(function (r) { return r.avg_hr !== null && (!filterClass || r.temp_class === filterClass); });
    hrChart.data.labels = rows.map(function (r) { return r.date; });
    hrChart.data.datasets[0].data = rows.map(function (r) { return r.avg_hr; });
    hrChart.update();
  }
  hrSelect.addEventListener('change', function () { renderHrChart(hrSelect.value); });
  renderHrChart('');

  // --- W/bpm推移 ---
  var wpbRows = DATA.runs.filter(function (r) { return r.new_style && r.w_per_bpm !== null && r.w_per_bpm !== undefined; });
  if (wpbRows.length) {
    new Chart(document.getElementById('chart-wpb'), {
      type: 'line',
      data: {
        labels: wpbRows.map(function (r) { return r.date; }),
        datasets: [
          { label: 'W/bpm', data: wpbRows.map(function (r) { return r.reference_only ? null : r.w_per_bpm; }), borderColor: COLORS[4], tension: 0.2, spanGaps: true },
          { label: '参考値（成長判定に使わない）', data: wpbRows.map(function (r) { return r.reference_only ? r.w_per_bpm : null; }), borderColor: '#94a3b8', borderDash: [5, 4], pointStyle: 'triangle', showLine: false }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { title: { display: true, text: 'W/bpm（高いほど効率が良い）' } } } }
    });
  } else {
    document.getElementById('chart-wpb').parentNode.innerHTML = '<div class="empty">パワー付きのランがまだありません</div>';
  }

  // --- RPE推移 ---
  var rpeRows = DATA.runs.filter(function (r) { return r.rpe !== null; });
  new Chart(document.getElementById('chart-rpe'), {
    type: 'line',
    data: {
      labels: rpeRows.map(function (r) { return r.date; }),
      datasets: [{ label: 'RPE (0-10)', data: rpeRows.map(function (r) { return r.rpe; }), borderColor: COLORS[2], tension: 0.2 }]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 10 } } }
  });

  // --- 直近ラン一覧（新しい順・アコーディオン） ---
  var listEl = document.getElementById('run-list');
  var runsDesc = DATA.runs.slice().reverse();
  runsDesc.forEach(function (r, idx) {
    var item = document.createElement('div');
    item.className = 'run-item';

    var summary = document.createElement('div');
    summary.className = 'run-summary';
    summary.innerHTML =
      '<span>' + escapeHtml(r.date) + '　' + fmtNum(r.distance_km, 2) + 'km　' + escapeHtml(r.avg_pace || '-') + '</span>' +
      '<span class="meta">' + (r.avg_temperature !== null ? fmtNum(r.avg_temperature, 1) + '℃　' : '') +
      (r.decoupling_pct !== null ? 'デカップリング' + fmtNum(r.decoupling_pct, 1) + '%' : '') + ' ▾</span>';

    var detail = document.createElement('div');
    detail.className = 'run-detail';
    detail.innerHTML =
      '<div class="stat-grid">' +
      '<div><span>タイム: </span>' + escapeHtml(r.duration || '-') + '</div>' +
      '<div><span>平均心拍: </span>' + (r.avg_hr !== null ? fmtNum(r.avg_hr, 0) + 'bpm' : '-') + '</div>' +
      '<div><span>湿度: </span>' + (r.humidity_pct !== null ? fmtNum(r.humidity_pct, 0) + '%' : '-') + '</div>' +
      '<div><span>体感温度: </span>' + (r.heat_index_c !== null ? fmtNum(r.heat_index_c, 1) + '℃' : '-') + '</div>' +
      '<div><span>ピッチ: </span>' + (r.avg_cadence !== null ? fmtNum(r.avg_cadence, 0) + 'spm' : '-') + '</div>' +
      '<div><span>GCT: </span>' + (r.avg_gct !== null ? fmtNum(r.avg_gct, 0) + 'ms' : '-') + '</div>' +
      '<div><span>コース: </span>' + escapeHtml(r.course || '-') +
        (r.course_link ? ' <a href="' + escapeHtml(r.course_link) + '" target="_blank" rel="noopener noreferrer">名前を入力（シートが開きます）</a>' : '') + '</div>' +
      '<div><span>獲得標高: </span>' + (r.elevation_gain_m !== null ? fmtNum(r.elevation_gain_m, 0) + 'm' : '-') + '</div>' +
      '<div><span>最高標高: </span>' + (r.max_elevation_m !== null ? fmtNum(r.max_elevation_m, 0) + 'm' : '-') + '</div>' +
      '<div><span>前半の獲得標高: </span>' + (r.first_half_gain_m !== null ? fmtNum(r.first_half_gain_m, 0) + 'm' : '-') + '</div>' +
      '<div><span>後半の獲得標高: </span>' + (r.second_half_gain_m !== null ? fmtNum(r.second_half_gain_m, 0) + 'm' : '-') + '</div>' +
      '<div><span>停止時間: </span>' + (r.stopped_sec !== null ? fmtMmss(r.stopped_sec) : '-') + '</div>' +
      '<div><span>平均GAP: </span>' + escapeHtml(r.avg_gap || '-') + '</div>' +
      '<div><span>平均パワー: </span>' + (r.avg_power_w !== null ? fmtNum(r.avg_power_w, 0) + 'W' : '-') + '</div>' +
      '<div><span>最大パワー: </span>' + (r.max_power_w !== null ? fmtNum(r.max_power_w, 0) + 'W' : '-') + '</div>' +
      '<div><span>W/bpm: </span>' + (r.w_per_bpm !== null ? fmtNum(r.w_per_bpm, 2) : '-') + '</div>' +
      '<div><span>デカップリング(ペース/GAP/パワー): </span>' + fmtNum(r.decoupling_pace_pct, 1) + ' / ' + fmtNum(r.decoupling_gap_pct, 1) + ' / ' + fmtNum(r.decoupling_power_pct, 1) + '%</div>' +
      '</div>' +
      tagsHtml(r) +
      (r.plan_lines && r.plan_lines.length ? '<div class="pre" style="margin:6px 0"><b>計画との照合</b>\n' + escapeHtml(r.plan_lines.join('\n')) + '</div>' : '') +
      (r.km && r.km.labels ? '<div class="small-chart"><canvas id="km-chart-' + escapeHtml(r.activity_id) + '"></canvas></div>' : '') +
      (r.note ? '<div>体感メモ: ' + escapeHtml(r.note) + '</div>' : '') +
      (r.analysis_full_text ? '<div class="analysis-text">' + nl2br(r.analysis_full_text) + '</div>' : '') +
      (r.next_training_summary ? '<div class="next-training">' + escapeHtml(r.next_training_summary) + '</div>' : '');

    summary.addEventListener('click', function () {
      detail.classList.toggle('open');
      if (detail.classList.contains('open')) { drawKmChart(r); }
    });
    item.appendChild(summary);
    item.appendChild(detail);
    listEl.appendChild(item);
  });
})();
</script>
</body>
</html>
